<!DOCTYPE html>
<html>

<head>
    <title>Student Login - StudentHub Portal</title>

    <style>

        body{
            font-family:Arial,sans-serif;
            background:rgb(245,245,245);
            margin:0;
        }

        header{
            background:rgb(33,150,243);
            color:white;
            text-align:center;
            padding:20px;
        }

        nav{
            background:rgb(24,112,201);
            text-align:center;
            padding:15px;
        }

        nav a{
            color:white;
            text-decoration:none;
            font-size:18px;
            margin:20px;
        }

        nav a:hover{
            color:yellow;
        }

        .login-box{
            background:white;
            width:400px;
            margin:40px auto;
            padding:30px;
            border-radius:10px;
        }

        .login-box h2{
            text-align:center;
            color:rgb(33,150,243);
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:5px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            border:1px solid rgb(180,180,180);
            border-radius:5px;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:12px;
            background:rgb(33,150,243);
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
        }

        button:hover{
            background:rgb(24,112,201);
        }

        .register{
            text-align:center;
            margin-top:20px;
        }

        .register a{
            text-decoration:none;
            color:rgb(33,150,243);
        }

        footer{
            background:rgb(33,150,243);
            color:white;
            text-align:center;
            padding:15px;
            margin-top:30px;
        }

    </style>

</head>

<body>

<header>
    <h1>StudentHub Portal</h1>
    <p>Student Login</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
</nav>

<div class="login-box">

    <h2>Student Login</h2>

    <form action="student.html">

        <label>Email</label>
        <input type="email" placeholder="Enter Email">

        <label>Password</label>
        <input type="password" placeholder="Enter Password">

        <button type="submit">Login</button>

    </form>

    <div class="register">
        <p>Don't have an account?
            <a href="register.html">Register</a>
        </p>
    </div>

</div>

<footer>
    <p>&copy; 2026 StudentHub Portal. All Rights Reserved.</p>
</footer>

</body>

</html>
